{% extends "base.html" %}

{% block title %}Вхід — LOQ Market{% endblock %}

{% block content %}
<section class="mx-auto max-w-lg rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <p class="mb-2 text-sm font-semibold uppercase tracking-wider text-gray-500">LOQ Market</p>
    <h1 class="mb-2 text-3xl font-bold text-gray-900">Вхід</h1>
    <p class="mb-6 text-gray-600">Увійди, щоб оформити замовлення та переглядати його історію.</p>
    <form method="post" class="space-y-4">
        <input type="hidden" name="next" value="{{ next_path }}">
        <label class="block text-sm font-medium text-gray-700">Email
            <input type="email" name="email" required autocomplete="email" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2">
        </label>
        <label class="block text-sm font-medium text-gray-700">Пароль
            <input type="password" name="password" required autocomplete="current-password" class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2">
        </label>
        <button type="submit" class="w-full rounded-md bg-yellow-300 px-5 py-3 font-bold text-gray-900 hover:bg-yellow-400">Увійти</button>
    </form>
    <p class="mt-5 text-sm text-gray-600">Ще немає облікового запису? <a class="font-semibold underline" href="{{ url_for('register') }}">Зареєструватися</a></p>
</section>
{% endblock %}
